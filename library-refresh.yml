name: Refresh library

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours (minute 17 avoids the top-of-hour rush)
  workflow_dispatch: {}       # lets you press "Run workflow" by hand
  push:
    paths: ['robot/**', '.github/workflows/library-refresh.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# Never two robots at once: they would fight over quota and the published files.
concurrency:
  group: library-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test robot/refresh.test.mjs
      - name: Update library
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LIBRARY_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          WINDOW_DAYS: '180'
          DAILY_QUOTA_BUDGET: '8000'
          REFRESH_AFTER_HOURS: '72'
        run: node robot/refresh.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
